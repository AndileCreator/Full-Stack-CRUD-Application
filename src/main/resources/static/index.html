
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>User Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-800">
                Register Form
            </h2>
        </div>

        <form id="userForm" class="space-y-5">

            <div>
                <label for="userName"
                       class="block text-sm font-semibold text-slate-700 mb-2">
                    Full Name
                </label>

                <input
                        id="userName"
                        placeholder="Enter your name"
                        required
                        type="text"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                />
            </div>

            <div>
                <label for="email"
                       class="block text-sm font-semibold text-slate-700 mb-2">
                    Email Address
                </label>

                <input
                        id="email"
                        placeholder="Enter your email"
                        required
                        type="email"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                />
            </div>

            <button
                    type="submit"
                    class="w-full bg-teal-900 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Register User
            </button>

        </form>

        <p id="message" class="mt-5 text-center text-sm"></p>

    </div>
</div>

<script src="index.js"></script>

</body>
</html>
